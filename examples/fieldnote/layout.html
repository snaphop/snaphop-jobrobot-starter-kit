<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · {{company}}</title>
<link rel="icon" href="/brand/art/favicon.svg">
<link rel="stylesheet" href="/brand/fieldnote.css">
{{head}}
</head>
<body>
<a class="fn-skip" href="#page">Skip to content</a>
<div class="fn-topbar"><p>We're hiring. <a href="https://careers.fieldnote.example/jobs/">See every open role</a></p></div>
<header class="fn-masthead">
  <div class="fn-masthead__inner">
    <a class="fn-wordmark" href="https://careers.fieldnote.example/"><img src="/brand/art/wordmark.svg" alt="{{company}} home" width="280" height="60"></a>
    <nav class="fn-nav" aria-label="Site">
      <ul>
        <li><a href="https://careers.fieldnote.example/life-here/">Life here</a></li>
        <li><a href="https://careers.fieldnote.example/how-we-hire/">How we hire</a></li>
        <li><a href="https://careers.fieldnote.example/jobs/locations/">By location</a></li>
        <li><a href="https://careers.fieldnote.example/jobs/categories/">By category</a></li>
        <li><a href="https://careers.fieldnote.example/jobs/">Open roles</a></li>
      </ul>
    </nav>
  </div>
</header>
<div class="fn-page" id="page">
{{content}}
</div>
<footer class="fn-footer">
  <div class="fn-footer__inner">
    <div>
      <p class="fn-footer__name">{{company}}</p>
      <p>An example site. Not a live careers site.</p>
    </div>
    <ul>
      <li><a href="https://careers.fieldnote.example/jobs/">Open roles</a></li>
      <li><a href="https://careers.fieldnote.example/privacy">Privacy notice</a></li>
    </ul>
  </div>
</footer>
</body>
</html>
